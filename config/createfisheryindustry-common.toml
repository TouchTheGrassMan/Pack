
#Настройки захвата сущностей каркасной ловушкой
[frameTrap]
	#Список реестровых имён сущностей, которых всегда можно ловить (белый список). Пример: 'minecraft:squid'
	whitelist = ["minecraft:phantom", "minecraft:squid", "minecraft:spider", "minecraft:cave_spider", "minecraft:silverfish"]
	#Список реестровых имён сущностей, которых нельзя ловить (чёрный список). Пример: 'minecraft:dolphin'
	blacklist = ["minecraft:dolphin", "minecraft:axolotl", "minecraft:cat", "minecraft:allay"]

#Настройки рыбалки каркасной ловушки
[fishing]
	#Включить рыбалку для каркасной ловушки
	enableFishing = true
	#Включить лавовую рыбалку для каркасной ловушки (требуется окружение из лавы)
	enableLavaFishing = true
	#Использовать таблицы добычи Nether Depths Upgrade для лавовой рыбалки, если они доступны
	#Если выключено или NDU не установлен, будет использована стандартная таблица рыболовной добычи
	useNDULootTables = true
	#Множитель задержки обычной рыбалки в воде
	#Меньше значение — быстрее рыбалка, больше значение — медленнее рыбалка
	#По умолчанию: 1.0 (обычная скорость), 0.5 = вдвое быстрее, 2.0 = вдвое медленнее
	#Range: 0.1 ~ 10.0
	fishingCooldownMultiplier = 1.0
	#Множитель задержки лавовой рыбалки
	#Меньше значение — быстрее рыбалка, больше значение — медленнее рыбалка
	#По умолчанию: 1.5 (медленнее рыбалки в воде), 0.5 = вдвое быстрее, 2.0 = вдвое медленнее
	#Range: 0.1 ~ 10.0
	lavaFishingCooldownMultiplier = 1.5
	#Базовый шанс успеха обычной рыбалки в воде (от 0.0 до 1.0)
	#По умолчанию: 0.25 (шанс 25%), 1.0 = всегда успешно, 0.0 = никогда
	#Range: 0.0 ~ 1.0
	fishingSuccessRate = 0.25
	#Базовый шанс успеха лавовой рыбалки (от 0.0 до 1.0)
	#По умолчанию: 0.3 (шанс 30%, сложнее рыбалки в воде)
	#Range: 0.0 ~ 1.0
	lavaFishingSuccessRate = 0.3

#Настройки водолазного снаряжения
[divingEquipment]

	#Настройки усиленного прыжка
	[divingEquipment.jump]
		#Базовая сила прыжка в жидкостях при надетом водолазном снаряжении
		#По умолчанию: 1.0 (чем выше, тем сильнее прыжок)
		#Range: 0.1 ~ 2.0
		baseJumpPower = 1.0
		#Сила прыжка при спринте в жидкостях с водолазным снаряжением
		#По умолчанию: 1.0 (чем выше, тем сильнее прыжок)
		#Range: 0.1 ~ 2.0
		sprintJumpPower = 1.0
		#Задержка между усиленными прыжками в тиках (20 тиков = 1 секунда)
		#По умолчанию: 10
		#Range: 0 ~ 100
		jumpCooldown = 10
		#Расход сытости за усиленный прыжок
		#По умолчанию: 0.05 (1.0 = 1 полный пункт сытости)
		#Range: 0.0 ~ 1.0
		jumpHungerCost = 0.05

	#Настройки усиленного спринта
	[divingEquipment.sprint]
		#Множитель скорости спринта для медных водолазных поножей
		#По умолчанию: 0.01 (чем выше, тем быстрее движение)
		#Range: 0.0 ~ 0.5
		copperSprintSpeed = 0.01
		#Множитель скорости спринта для незеритовых водолазных поножей
		#По умолчанию: 0.01 (чем выше, тем быстрее движение)
		#Range: 0.0 ~ 0.5
		netheriteSprintSpeed = 0.01
		#Расход сытости в секунду при спринте под водой
		#По умолчанию: 0.1 (1.0 = 1 полный пункт сытости в секунду)
		#Range: 0.0 ~ 1.0
		sprintHungerCostPerSecond = 0.1
		#Окно времени для двойного нажатия W для начала спринта (в тиках)
		#По умолчанию: 7
		#Range: 1 ~ 20
		sprintDoubleClickWindow = 7

	#Общие настройки водолазного снаряжения
	[divingEquipment.general]
		#Отключать урон от падения после усиленных прыжков
		#По умолчанию: true
		preventFallDamage = true
		#Минимальный уровень сытости для усиленного спринта/прыжка (0–20)
		#По умолчанию: 6 (3 деления сытости)
		#Range: 0 ~ 20
		minHungerLevel = 6
		#Множитель поля зрения при подводном спринте (1.0 = без эффекта, 1.01 = стандартный эффект спринта)
		#По умолчанию: 1.01
		#Range: 1.0 ~ 2.0
		sprintFovMultiplier = 1.01

