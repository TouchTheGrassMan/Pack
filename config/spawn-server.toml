
[spawn-general]
	#Добавлять ли предметы Spawn во вкладки креатива Minecraft.
	add_onto_tabs = true
	#Должны ли все предметы Spawn находиться во вкладке Spawn.
	creative_tab = true
	#Должны ли яйца призыва Spawn находиться в отдельной вкладке и отсутствовать во вкладке Spawn.
	spawn_egg_tab = false
	#Запрещать ли игрокам, не являющимся владельцами, ломать сундуки, запертые осьминогом. Если включено, их всё ещё можно разрушить взрывом.
	unbreakable_locked_chests = true

[sunflower-changes]
	#Заменять ли обычные подсолнухи новыми, которые следят за солнцем и дают семечки.
	sunflower_replacement = true

[parrot-changes]
	#Слезать ли с попугаев только при приседании в воздухе.
	parrot_dismounting_changes = true

[turtle-changes]
	#Могут ли черепахи появляться с морскими желудями на панцире.
	barnacle_turtle = true

[evoker-changes]
	#Превращают ли заклинатели голубоногих олуш в красноногих.
	evoker_booby_transformation = true

[fish-changes]
	#Спавнятся ли рыбы в приливных лужах только в самих лужах, а не в океане.
	fish_tide_pool_spawning_change = true
	#Могут ли рыбы плыть к брошенным.
	fish_follow_stranded = true
	#Могут ли рыбы плыть к морским коровам.
	fish_follow_sea_cows = true

[skeleton-changes]
	#Превращаются ли скелеты в шипастых после долгого пребывания в воде.
	skeleton_convert_into_barbed = true

[drowned-changes]
	#Могут ли утопленники появляться ночью на суше в биомах с тегом #spawns_water_hostiles_on_land. Если отключено, также удалите их из тега #overridden_spawns.
	drowned_placement_changes = true
	#Будет ли маленький утопленник верхом на морском коньке ронять новую пластинку при смерти.
	seahorse_jockeys_drop_disc = true

[creeper-changes]
	#Роняют ли криперы, убитые шипом, новую пластинку.
	creeper_drops_barbaric = true

[aggression-changes-and-additions]
	#Охотятся ли волки на додо.
	wolves_hunt_dodos = true
	#Охотятся ли кошки на додо.
	cats_hunt_dodos = true
	#Охотятся ли оцелоты на додо.
	ocelots_hunt_dodos = true
	#Охотятся ли белые медведи на тюленей.
	polar_bears_hunt_seals = true

